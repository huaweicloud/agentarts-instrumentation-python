name: Preview Release
# Any v* tag produces a prerelease with the built wheels attached
# (preview builds for early adopters; final publishing goes to PyPI).
#
# agentarts-instrumentation-jiuwen is a self-contained (fat) wheel that
# bundles the core namespace modules — it is the only artifact users
# need to install. core is a workspace-internal package and is not
# attached to releases in fat-wheel mode.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  preview-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build jiuwen fat wheel
        run: |
          uv build jiuwen --wheel
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "Preview $GITHUB_REF_NAME" \
            --notes "Preview build from tag $GITHUB_REF_NAME. Install the single self-contained wheel: agentarts-instrumentation-jiuwen (bundles agentarts-instrumentation-core)." \
            dist/*.whl
