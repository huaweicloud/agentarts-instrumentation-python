name: CI
on:
  pull_request:
    branches: [main]
  push:
    # openjiuwen is the current integration branch for the
    # multi-package migration work; CI runs on its pushes too.
    branches: [main, openjiuwen]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run linter
        run: |
          uvx ruff check core openjiuwen examples
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace
        run: uv sync --all-packages --all-extras
      - name: Run tests
        run: uv run pytest
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheels
        run: |
          uv build core
          uv build openjiuwen --wheel
