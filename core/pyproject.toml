[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarts-instrumentation-core"
dynamic = ["version"]
description = "Framework-agnostic OTLP exporter kernel for Huawei Cloud AgentArts (agent-ops): bounded-buffer OTLP export, copy-on-export span projection, and the runtime-injection toolkit."
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.25,<2.0"]
test = ["pytest>=7"]

[tool.hatch.version]
path = "src/agentarts_instrumentation/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentarts_instrumentation"]
